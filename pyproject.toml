[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-finding"
version = "0.1.0"
description = "Multi-stage OpenCV template matching with full and partial fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mi-finding = "mi_finding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

